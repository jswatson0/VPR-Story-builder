<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="tsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f2"/>
      <stop offset="100%" stop-color="#f0efe9"/>
    </linearGradient>
  </defs>
  <!-- Page background -->
  <rect width="400" height="260" fill="url(#tsBg)"/>
  <!-- Eyebrow -->
  <rect x="80" y="34" width="52" height="5" rx="2.5" fill="#f3a712" opacity="0.9"/>
  <!-- Headline line 1 -->
  <rect x="80" y="50" width="200" height="13" rx="3" fill="#131820" opacity="0.82"/>
  <!-- Headline line 2 -->
  <rect x="80" y="69" width="158" height="13" rx="3" fill="#131820" opacity="0.82"/>
  <!-- Lead paragraph -->
  <rect x="80" y="96" width="240" height="7" rx="3" fill="#131820" opacity="0.42"/>
  <rect x="80" y="109" width="228" height="7" rx="3" fill="#131820" opacity="0.42"/>
  <rect x="80" y="122" width="196" height="7" rx="3" fill="#131820" opacity="0.42"/>
