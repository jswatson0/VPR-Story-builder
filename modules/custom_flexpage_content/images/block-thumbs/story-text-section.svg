  <rect x="80" y="152" width="18" height="30" rx="2" fill="#131820" opacity="0.13"/>
  <!-- Body text lines (beside and below drop cap) -->
  <rect x="106" y="152" width="128" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <rect x="106" y="164" width="114" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <rect x="80" y="176" width="240" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <rect x="80" y="188" width="220" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <rect x="80" y="200" width="232" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <rect x="80" y="212" width="180" height="6" rx="3" fill="#131820" opacity="0.2"/>
  <!-- CTA button hint -->
  <rect x="80" y="228" width="72" height="18" rx="3" fill="#131820" opacity="0.12"/>
