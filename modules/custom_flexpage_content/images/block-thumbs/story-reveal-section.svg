<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2f4a"/>
      <stop offset="100%" stop-color="#0c1a28"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1f1f"/>
      <stop offset="100%" stop-color="#1a0d0d"/>
    </linearGradient>
    <!-- Shadow on the left edge of the sliding panel -->
    <linearGradient id="edge-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- Scroll indicator track -->
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- Panel 1: full-width base (pinned behind) -->
  <rect width="400" height="260" fill="url(#bg1)"/>
  <ellipse cx="140" cy="80" rx="180" ry="90" fill="#264870" opacity=".35"/>
  <!-- Panel 1 copy -->
  <rect x="28" y="174" width="48" height="6" rx="3" fill="#f3a712" opacity=".8"/>
  <rect x="28" y="187" width="148" height="11" rx="4" fill="#fff" opacity=".85"/>
  <rect x="28" y="205" width="112" height="7" rx="3" fill="#fff" opacity=".45"/>
  <rect x="28" y="218" width="88" height="7" rx="3" fill="#fff" opacity=".3"/>

  <!-- Panel 2: sliding in from the right, covering ~55% -->
  <rect x="178" y="0" width="222" height="260" fill="url(#bg2)"/>
  <ellipse cx="310" cy="110" rx="130" ry="80" fill="#6b2020" opacity=".35"/>
  <!-- Panel 2 copy -->
  <rect x="198" y="174" width="36" height="6" rx="3" fill="#f8971f" opacity=".8"/>
  <rect x="198" y="187" width="130" height="11" rx="4" fill="#fff" opacity=".85"/>
  <rect x="198" y="205" width="100" height="7" rx="3" fill="#fff" opacity=".45"/>

  <!-- Shadow on the leading edge of the sliding panel -->
  <rect x="178" y="0" width="22" height="260" fill="url(#edge-shadow)"/>

  <!-- Scroll track (right side, vertical) -->
  <rect x="374" y="20" width="6" height="220" rx="3" fill="url(#track)"/>
  <!-- Scroll thumb — positioned mid-way to indicate scroll progress -->
  <rect x="374" y="110" width="6" height="48" rx="3" fill="#fff" opacity=".35"/>

  <!-- Motion arrows: two stacked, indicating swipe-left direction -->
  <g opacity=".5">
    <polyline points="158,118 170,130 158,142" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="146,122 156,130 146,138" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
