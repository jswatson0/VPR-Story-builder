<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <!-- Background photo fill -->
  <rect width="400" height="260" fill="#1a2035"/>
  <!-- Simulated photo texture -->
  <rect width="400" height="260" fill="url(#heroGrad)"/>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3a5a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1021" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0a1021" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Hint of background landscape -->
  <ellipse cx="300" cy="80" rx="120" ry="60" fill="#263050" opacity="0.5"/>
  <rect x="0" y="140" width="400" height="120" fill="url(#overlayGrad)"/>
  <!-- Eyebrow -->
  <rect x="36" y="162" width="60" height="6" rx="3" fill="#f3a712" opacity="0.9"/>
  <!-- Headline lines -->
  <rect x="36" y="178" width="210" height="14" rx="3" fill="#f6f5f1" opacity="0.95"/>
  <rect x="36" y="198" width="170" height="14" rx="3" fill="#f6f5f1" opacity="0.95"/>
  <!-- Deck text -->
  <rect x="36" y="220" width="200" height="6" rx="3" fill="#f6f5f1" opacity="0.55"/>
  <rect x="36" y="232" width="160" height="6" rx="3" fill="#f6f5f1" opacity="0.55"/>
</svg>
